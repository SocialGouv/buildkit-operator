name: ci

# Gate the code on every PR and main push: build, vet, gofmt, race tests, lint. images.yml carries its
# own test job so tag builds are gated too (CI here does not run on tag pushes).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      # A flag the chart renders but the binary never defined does not fail subtly — Go exits 2 and the
      # container CrashLoopBackOffs. Only a rendered-chart-against-real-binary check can see that.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: chart flags match the binaries
        run: bash hack/check-chart-flags.sh
      - name: unit tests (race) + coverage gate
        run: |
          go test -race ./... -count=1 -coverprofile=cover.out -covermode=atomic
          bash hack/coverage.sh cover.out 85

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # Build golangci-lint with the runner's Go (from go.mod, 1.26) rather than a prebuilt binary:
      # a prebuilt binary built with an older Go refuses a go.mod targeting a newer Go.
      # renovate: datasource=go depName=github.com/golangci/golangci-lint/v2
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...
