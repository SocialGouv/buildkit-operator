name: images

# Build + push the buildd, companion and gateway images to this repo's GitHub Container Registry.
# Uses the Actions GITHUB_TOKEN (packages: write), so no personal token / scope is needed.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: # docs / Action / scripts / release tooling don't change the binaries
      - "**.md"
      - "docs/**"
      - "mkdocs.yml"
      - "action.yml"
      - "scripts/**"
      - "devbox.json"
      - "devbox.lock"
      - ".envrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".release-it.json"
      - "deploy/helm/**" # a chart bump ships no binary change
      - ".github/workflows/pages.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# The release pushes a commit and then a tag; both reach this workflow now that
# it authenticates as an App. Same ref never builds twice.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write # keyless cosign signing via GitHub OIDC

jobs:
  # Gate: never push an image built from code that fails vet/tests. ci.yml covers PRs and main pushes,
  # but NOT tag pushes (releases), so the gate has to live here too.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./... -count=1

  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one component failing must not cancel + leave the others unsigned
      matrix:
        component: [buildd, companion, gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/buildkit-operator-${{ matrix.component }}
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: cmd/${{ matrix.component }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Supply-chain attestations: SLSA provenance + SBOM, attached to the pushed image so
          # consumers can verify how/from-what it was built (docker buildx imagetools inspect / cosign).
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Keyless signature (Sigstore/Fulcio, GitHub OIDC identity) so consumers can verify the image is
      # genuinely from this workflow — provenance/SBOM are tamper-evident only once the digest is signed.
      # Verify: cosign verify ghcr.io/socialgouv/buildkit-operator-<component>@<digest> \
      #   --certificate-identity-regexp 'https://github.com/SocialGouv/buildkit-operator/.+' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: cosign sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
          COMPONENT: ${{ matrix.component }}
        # OCI references must be lowercase; github.repository_owner ("SocialGouv") is mixed-case, so
        # lowercase it in-shell (${OWNER,,}) before handing the digest to cosign.
        run: cosign sign --yes "ghcr.io/${OWNER,,}/buildkit-operator-${COMPONENT}@${DIGEST}"
