name: renovate

# Renovate AUTO-HÉBERGÉ. L'app Mend hébergée est bien installée sur l'org (« all repos ») mais
# n'a plus produit une seule PR nulle part dans SocialGouv depuis fin novembre 2025 — les mises à
# jour de dépendances se sont donc arrêtées en silence (c'est ainsi qu'un pin d'Action en Node 20
# a pourri ici pendant des mois, jusqu'à la dépréciation). Ce workflow exécute Renovate nous-mêmes
# pour ce dépôt, sans dépendre du service hébergé. La configuration reste .github/renovate.json5
# (inchangée, et validée : un dry-run résout le preset org et détecte les mises à jour réelles).
#
# Renovate s'authentifie avec l'App dédiée « SocialGouv Renovate » et NON avec GITHUB_TOKEN : les
# PR ouvertes par GITHUB_TOKEN ne déclenchent pas les autres workflows, donc leur CI ne partait
# jamais. Sous l'App, l'auteur des PR est socialgouv-renovate[bot], la CI se déclenche normalement,
# et cette identité dédiée est ce qui permet en aval de distinguer une PR de dépendances d'une PR
# humaine. L'App a besoin de `workflows: write` : helpers:pinGitHubActionDigests réécrit
# .github/workflows/**, et un push d'App sans cette permission est refusé par GitHub.
on:
  schedule:
    - cron: "0 3 * * 1" # lundi 03:00 UTC
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run : journalise ce qui serait fait, ne crée rien"
        type: boolean
        default: false
      logLevel:
        description: "Niveau de log"
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: write # branches de mise à jour
  pull-requests: write # ouverture/màj des PR

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - uses: renovatebot/github-action@1a96852b0384df1837619d04c60b2d10d1f9ff08 # v46.1.21
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # La config vit dans le dépôt : ne jamais ouvrir de PR d'onboarding, et échouer
          # bruyamment si elle venait à disparaître plutôt que de tourner sur des défauts.
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
