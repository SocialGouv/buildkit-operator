name: renovate

# Renovate AUTO-HÉBERGÉ. L'app Mend hébergée est bien installée sur l'org (« all repos ») mais
# n'a plus produit une seule PR nulle part dans SocialGouv depuis fin novembre 2025 — les mises à
# jour de dépendances se sont donc arrêtées en silence (c'est ainsi qu'un pin d'Action en Node 20
# a pourri ici pendant des mois, jusqu'à la dépréciation). Ce workflow exécute Renovate nous-mêmes
# pour ce dépôt, sans dépendre du service hébergé. La configuration reste .github/renovate.json5
# (inchangée, et validée : un dry-run résout le preset org et détecte les mises à jour réelles).
#
# Renovate s'authentifie avec l'App dédiée « SocialGouv Renovate » et NON avec GITHUB_TOKEN : les
# PR ouvertes par GITHUB_TOKEN ne déclenchent pas les autres workflows, donc leur CI ne partait
# jamais. Sous l'App, l'auteur des PR est socialgouv-renovate[bot], la CI se déclenche normalement,
# et cette identité dédiée est ce qui permet en aval de distinguer une PR de dépendances d'une PR
# humaine. L'App a besoin de `workflows: write` : helpers:pinGitHubActionDigests réécrit
# .github/workflows/**, et un push d'App sans cette permission est refusé par GitHub.
on:
  # GitHub drops most scheduled triggers here: the hourly cron at :23 materialised as 3-4 runs a
  # day (measured 2026-11-01..03, gaps of up to 11 h). A denser schedule leaves more survivors;
  # CVE alerts bypass the 14-day cooldown, so each surviving pass is a CVE check.
  schedule:
    - cron: "8,23,38,53 * * * *" # every 15 min, off the :00/:30 peaks
  # A merge on main leaves every other open update PR behind the strict ruleset, and only a
  # pass rebases them: it starts at the merge instead of at the next surviving cron.
  push:
    branches: [main]
  # Ticking a box on the Dependency Dashboard asks for a pass (open a held PR, rebase one): it
  # starts one now. Renovate rewrites the dashboard itself on every pass, so the job ignores
  # edits made by a bot — otherwise each pass would trigger the next.
  issues:
    types: [edited]
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run : journalise ce qui serait fait, ne crée rien"
        type: boolean
        default: false
      logLevel:
        description: "Niveau de log"
        type: choice
        options: [info, debug]
        default: info

permissions:
  contents: write # branches de mise à jour
  pull-requests: write # ouverture/màj des PR

# One pass at a time: a burst of triggers (a merge, a cron, a tick) collapses into the running
# pass plus one pending, and a pass re-reads the whole repository anyway. Removing this group
# (#36) did not raise the cadence — the dropping is GitHub's — so the serialisation is back.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: github.event_name != 'issues' || (github.event.issue.title == 'Dependency Dashboard' && github.event.sender.type != 'Bot')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          # `client-id` accepte aussi bien l'App ID numérique que le Client ID : l'action lit
          # `getInput("client-id") || getInput("app-id")` et passe la valeur telle quelle à
          # `createAppAuth({ appId })`, que GitHub accepte comme `iss` d'un JWT sous les deux
          # formes. Le secret reste donc RENOVATE_APP_ID ; seule la clé d'entrée change, `app-id`
          # étant déprécié (deux warnings par run).
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
      - uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # La config vit dans le dépôt : ne jamais ouvrir de PR d'onboarding, et échouer
          # bruyamment si elle venait à disparaître plutôt que de tourner sur des défauts.
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "required"
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
