name: pages

# Publish docs/ to GitHub Pages with mkdocs-material (renders the Mermaid flow diagrams).
on:
  push:
    branches: [main]
    paths: [docs/**, README.md, mkdocs.yml, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material
      # Render the root README (the rich overview) as the site Home — single source of truth. Rewrite its
      # docs/ links to the site root, and the few root-file links to absolute GitHub URLs.
      - name: Render README as the docs home
        run: |
          sed -e 's#](docs/#](#g' \
              -e 's#](CONTRIBUTING.md)#](https://github.com/socialgouv/buildkit-operator/blob/main/CONTRIBUTING.md)#g' \
              -e 's#](LICENSE)#](https://github.com/socialgouv/buildkit-operator/blob/main/LICENSE)#g' \
              -e 's#](Taskfile.yml)#](https://github.com/socialgouv/buildkit-operator/blob/main/Taskfile.yml)#g' \
              -e 's#](.github/renovate.json5)#](https://github.com/socialgouv/buildkit-operator/blob/main/.github/renovate.json5)#g' \
              README.md > docs/index.md
      - run: mkdocs build --site-dir _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
