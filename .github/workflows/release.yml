name: release

# Cut a versioned release with release-it: bump the chart version, changelog, git tag (v*), GitHub
# release, and publish the Helm chart as an OCI artifact to ghcr.io/socialgouv/charts. The v* tag
# then triggers images.yml, which tags the container images with the same semver.
on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Release the version in package.json as-is (none), or bump it first"
        default: none
        type: choice
        options: [none, patch, minor, major]

permissions:
  contents: write # tag + GitHub release
  packages: write # push the OCI chart
  id-token: write # OIDC exchange for the token-bureau App token (see below)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # `main` requires the ci checks to pass, and release-it pushes its
      # "chore: release vX" commit + tag straight to main — a push that carries
      # no checks of its own. GITHUB_TOKEN cannot be granted a ruleset bypass
      # (a repository ruleset only accepts actors from the owning org), so the
      # release authenticates as the org's token-bureau App, which the ruleset
      # does bypass. Same mechanism SocialGouv/iterion uses for its releases.
      - uses: SocialGouv/token-bureau@84d3a5f6525f1e86163602fc2e38f767985f450e # v0.0.9
        id: token
        with:
          token-bureau-url: https://token-bureau.fabrique.social.gouv.fr
          audience: socialgouv
          permissions: '{"contents": "write"}'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
      # pnpm is provisioned by Corepack, pinned via the package.json "packageManager" field.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile # frozen lockfile keeps the working dir clean for release-it
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: |
          if [ "${{ inputs.increment }}" = "none" ]; then
            pnpm exec release-it --no-increment --ci
          else
            pnpm exec release-it "${{ inputs.increment }}" --ci
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # release-it handles the version/tag/changelog/chart-push; the GitHub Release is created here via
      # the gh CLI (release-it's own octokit release call is flaky on v17 — "reading 'debug'" crash).
      - run: gh release create "$(git describe --tags --abbrev=0)" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Consumers pin the Action as `socialgouv/buildkit-operator@v1` — a MOVING major tag. Moving it
      # by hand is what let it silently drift 3 releases behind (fleet stuck on an old Action while
      # the server moved on), so every release re-points it. Bump MAJOR_TAG here (v2, …) only when
      # the Action itself takes a breaking change — it is the Action's line, not the chart semver.
      - name: Re-point the moving major tag at this release
        env:
          MAJOR_TAG: v1
        run: |
          set -eu
          TAG="$(git describe --tags --abbrev=0)"
          git tag -f "$MAJOR_TAG" "$TAG^{}"
          git push -f origin "refs/tags/$MAJOR_TAG"
          echo "$MAJOR_TAG -> $TAG ($(git rev-parse --short "$TAG^{}"))"

      # The v* tag push builds the matching semver images by itself: App
      # installation tokens are not subject to GitHub's anti-recursion rule, so
      # images.yml fires on the tag. Dispatching it here as well would build and
      # sign the same digests twice.
