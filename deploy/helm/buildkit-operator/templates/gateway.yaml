{{- if .Values.gateway.host }}
# Shared SNI gateway: ONE LoadBalancer fronts every daemon (vs one public LB per daemon). It peeks
# the ClientHello SNI <daemon>.<host> and pipes to the daemon's ClusterIP — mTLS stays end-to-end.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "buildkit-operator.fullname" . }}-gateway
  namespace: {{ include "buildkit-operator.operatorNamespace" . }}
  labels:
    {{- include "buildkit-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "buildkit-operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "buildkit-operator.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
    spec:
      # Every connection through the gateway is a build in progress, so a rollout must not cut them:
      # on SIGTERM it stops accepting and keeps proxying what is already open. The grace period is the
      # real deadline (the kubelet SIGKILLs at it), and the process's own budget sits just under it.
      terminationGracePeriodSeconds: {{ add .Values.gateway.drainSeconds 60 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            # Internal non-privileged listen port. The Service may expose gateway.externalPort (e.g.
            # 443 for egress proxies), but the non-root container still binds buildkit.port.
            - --listen=:{{ .Values.buildkit.port }}
            - --health-listen=:8081
            # Primary domain + any extraDomains (the gateway accepts SNI for ANY of them, so one
            # gateway can front several client populations, e.g. a public domain + a CI-platform domain).
            - --domain={{ prepend .Values.gateway.extraDomains .Values.gateway.host | join "," }}
            - --namespace={{ include "buildkit-operator.buildsNamespace" . }}
            - --daemon-port={{ .Values.buildkit.port }} # internal: the gateway dials daemons on the mTLS port
            - --drain-seconds={{ .Values.gateway.drainSeconds }}
            {{- with .Values.gateway.maxConns }}
            # Cap concurrent TCP connections BEFORE mTLS auth, so an unauthenticated flood can't exhaust
            # the public-facing gateway's resources. 0 = unlimited.
            - --max-conns={{ . }}
            {{- end }}
          ports:
            - name: sni
              containerPort: {{ .Values.buildkit.port }}
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "buildkit-operator.fullname" . }}-gateway
  namespace: {{ include "buildkit-operator.operatorNamespace" . }}
  labels:
    {{- include "buildkit-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  {{- with .Values.gateway.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "buildkit-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
  ports:
    - name: sni
      port: {{ .Values.gateway.externalPort | default .Values.buildkit.port }}
      targetPort: {{ .Values.buildkit.port }}
      protocol: TCP
{{- end }}
