apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "buildkit-operator.fullname" . }}-buildd
  namespace: {{ include "buildkit-operator.buildsNamespace" . }}
  labels:
    {{- include "buildkit-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: buildd
rules:
  # --- buildkit-operator custom resources -------------------------------------------
  # Full lifecycle over the BuildProjects the controller reconciles (incl. creating fork/clone
  # children and reaping idle forks).
  - apiGroups: ["buildkit-operator.socialgouv.github.io"]
    resources: ["buildprojects"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Status subresource (write-back of observed state / conditions / inflight count).
  - apiGroups: ["buildkit-operator.socialgouv.github.io"]
    resources: ["buildprojects/status"]
    verbs: ["get", "update", "patch"]

  # --- apps: the per-project StatefulSet-of-1 the controller creates --------
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # --- policy: one PodDisruptionBudget per daemon, so a node drain waits for
  # the builds running on it instead of evicting them mid-stream.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # --- core: per-project Service / Pods / PVC, plus mounted config ----------
  # Services (one per project, TCP+mTLS :1234) and PVCs (the warm cache) are
  # created/owned by the controller.
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Pods: status/readiness of the daemons (the StatefulSet owns them), plus the delete that
  # maybeAutoGrow uses to bounce an idle daemon once its PVC reports FileSystemResizePending —
  # without it the kubelet never remounts the grown filesystem and auto-grow silently no-ops,
  # since the reconciler only logs the failure at V(1).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  # Daemon cert Secret: buildd reads this Secret only to warn early when gateway.host is configured
  # but the daemon certificate lacks a matching wildcard SAN. Daemon pods mount certs/config via the
  # kubelet; buildd does not need list/watch over Secrets or ConfigMaps.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.certs.daemonSecretName | quote }}]
    verbs: ["get"]
  # Events: emit reconcile events on the CRs/daemons.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # --- snapshot.storage.k8s.io: cache durability / seed (M3) ----------------
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "buildkit-operator.fullname" . }}-leader-election
  namespace: {{ include "buildkit-operator.operatorNamespace" . }}
  labels:
    {{- include "buildkit-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: buildd
rules:
  # --- leader election (HA): the controller-runtime manager holds a Lease ----
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The manager records its LeaderElection event next to the Lease — in THIS
  # namespace, not the builds one the buildd Role above covers. Without it the
  # manager logs "events is forbidden" on every leader transition and the
  # operator namespace never surfaces a single Event.
  # Both API groups on purpose: leader election still uses the deprecated core/v1
  # recorder, and controller-runtime carries a TODO to move it to events.k8s.io/v1
  # (kubernetes/kubernetes#82846). Granting core alone would turn that bump into a
  # silent return of this same failure.
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
