apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "buildkit-operator.serviceAccountName" . }}
  namespace: {{ include "buildkit-operator.operatorNamespace" . }}
  labels:
    {{- include "buildkit-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: buildd
# buildd IS a controller-runtime manager: it needs the SA token to watch/reconcile BuildProjects and
# manage StatefulSets/Services/PVCs. Set explicitly so a cluster default of false doesn't break it.
automountServiceAccountToken: true
{{- if .Values.daemonServiceAccount }}
---
# The per-project buildkitd daemons run as this ServiceAccount, in the BUILDS namespace. It carries no
# RBAC and no API token: buildkitd never calls the Kubernetes API. Its only job is to be an identity a
# cloud workload-identity binding can attach to (EKS Pod Identity / IRSA, GKE / Azure Workload
# Identity), so the daemons' cloud credentials are not shared with every other pod in that namespace
# via the `default` SA. The binding itself is applied out-of-band, to this name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.daemonServiceAccount }}
  namespace: {{ include "buildkit-operator.buildsNamespace" . }}
  labels:
    {{- include "buildkit-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: buildkitd
automountServiceAccountToken: false
{{- end }}
