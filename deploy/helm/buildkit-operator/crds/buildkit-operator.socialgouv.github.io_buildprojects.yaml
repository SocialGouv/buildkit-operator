---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: buildprojects.buildkit-operator.socialgouv.github.io
spec:
  group: buildkit-operator.socialgouv.github.io
  names:
    kind: BuildProject
    listKind: BuildProjectList
    plural: buildprojects
    shortNames:
    - bp
    - buildproj
    singular: buildproject
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.arch
      name: Arch
      type: string
    - jsonPath: .spec.tier
      name: Tier
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.endpoint
      name: Endpoint
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BuildProject is the cache identity + lifecycle of one hot buildkitd.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BuildProjectSpec is the cache identity and daemon lifecycle of one
              (project, arch). All builds that must share a cache MUST resolve to the same
              Key — see internal/router for the normalization that guarantees this.
            properties:
              arch:
                description: Arch is the build architecture.
                enum:
                - amd64
                - arm64
                type: string
              cacheVolumeGi:
                default: 60
                description: |-
                  CacheVolumeGi sizes the cache volume. On gen2, throughput scales with size
                  (~30 IOPS/Gi + 0.5 MB/s/Gi), so size for bandwidth, not just capacity.
                format: int32
                minimum: 1
                type: integer
              fanout:
                description: |-
                  Fanout is the number of additional warm clone daemons for a saturated project (M5,
                  conditional — vertical first). Each clone is a sibling BuildProject seeded (CoW) from the
                  latest snapshot; layers converge via shared S3. 0 = no fan-out.
                format: int32
                minimum: 0
                type: integer
              idleTimeoutSec:
                default: 900
                description: |-
                  IdleTimeoutSec is the idle window before scale-to-zero (ignored on hot).
                  Default seeded from bench B (reattach cycle ~31s p50 => generous timeout).
                format: int32
                minimum: 0
                type: integer
              key:
                description: |-
                  Key is the stable cache identity: a truncated sha256 of the normalized
                  (repo, target, arch). Set by the router at creation; immutable.
                minLength: 1
                type: string
              name:
                description: |-
                  Name is the optional monorepo component (image/path) within the repo. Informational; it
                  segments the Key so a monorepo's images each get their own daemon. Empty for single-image repos.
                type: string
              repo:
                description: |-
                  Repo is the normalized source repository (lowercased, scheme/.git stripped). The Key is what
                  routes, but this is what /complete authorizes against — a verified caller may only release builds
                  of its own repo — so a project created with it empty cannot be authorized (the check is skipped).
                type: string
              resources:
                description: Resources for the buildkitd container (CPU/RAM of the
                  daemon).
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              restoreFromSnapshot:
                description: |-
                  RestoreFromSnapshot, if set, seeds the cache PVC from this VolumeSnapshot on creation
                  (DR / new cluster / lost volume). Ignored once the PVC exists.
                type: string
              s3CachePolicy:
                default: cadence
                description: |-
                  S3CachePolicy controls the project's use of the shared S3 cold cache:
                  cadence = import always / export at most once per the operator's export
                  interval; always = export every build; never = no S3 cache at all.
                enum:
                - cadence
                - always
                - never
                type: string
              securityProfile:
                default: rootless
                description: SecurityProfile hardens the buildkitd pod.
                enum:
                - rootless
                - userns
                - privileged
                type: string
              snapshotEverySec:
                description: |-
                  SnapshotEverySec is the durability/seed snapshot cadence (0 = never). OVH supports
                  in-use snapshots, so this does not require scale-to-zero.
                format: int32
                minimum: 0
                type: integer
              storageClass:
                description: |-
                  StorageClass for the cache PVC. No fixed default (cloud-portable): when empty, buildd stamps its
                  operator-wide default (--default-storage-class), and an empty default leaves StorageClassName unset
                  so the cluster's DEFAULT StorageClass is used. OVH MKS: set the gen2 high-speed class; EKS: e.g.
                  ebs-gp3 (or leave empty for the cluster default).
                type: string
              target:
                description: Target is the Dockerfile target stage this daemon serves
                  ("" => default).
                type: string
              tier:
                default: warm
                description: Tier controls scale-to-zero. hot is never scaled to zero;
                  warm scales to zero after IdleTimeoutSec.
                enum:
                - hot
                - warm
                type: string
            required:
            - arch
            - key
            type: object
          status:
            description: BuildProjectStatus reflects the observed daemon state.
            properties:
              conditions:
                description: Conditions follow the standard k8s condition convention
                  (Ready, Degraded).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: Endpoint is the mTLS address clients dial (tcp://svc.ns.svc:1234).
                type: string
              inflight:
                description: |-
                  Inflight are the builds currently routed to this daemon, each with the time /route registered
                  it. This is the source of truth: entries expire individually (--max-build-seconds), so a build
                  whose /complete never arrives cannot pin the daemon warm forever, and cannot drag a genuinely
                  long-running sibling down with it either.
                items:
                  description: |-
                    InflightBuild is one routed build that has not been released yet. Each entry ages on its OWN
                    clock, so a build whose /complete never arrives expires by itself — without touching the entries
                    of builds that are still running.
                  properties:
                    id:
                      description: ID is the opaque token /route returned to the client,
                        which /complete echoes back.
                      type: string
                    since:
                      description: |-
                        Since is when /route registered this build. The reconciler expires entries older than
                        --max-build-seconds.
                      format: date-time
                      type: string
                  required:
                  - id
                  - since
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              inflightBuilds:
                description: |-
                  InflightBuilds is len(Inflight), maintained in the same write for `kubectl get` and dashboards.
                  It is a PROJECTION: never decide anything about a daemon from it — read Inflight (or
                  InflightCount). The reconciler reads it for one purpose only, to notice that it disagrees with
                  the entries and rewrite it.
                format: int32
                type: integer
              lastBuildTime:
                description: LastBuildTime is when a build last touched this daemon
                  (drives idle).
                format: date-time
                type: string
              lastCacheExportGrant:
                description: |-
                  LastCacheExportGrant is when buildd last granted an S3 cache export to a
                  routed build — the cadence clock of s3CachePolicy=cadence.
                format: date-time
                type: string
              lastSnapshot:
                description: LastSnapshot is the name of the most recent VolumeSnapshot
                  (M3).
                type: string
              phase:
                description: 'Phase is a coarse summary: Pending | Warm | Idle | Scaling
                  | Failed.'
                type: string
              recentBuildTimes:
                description: |-
                  RecentBuildTimes are the start times of recent routed builds (bounded ring,
                  newest last, pruned to AdaptiveWindow). Written conflict-safely by the routing
                  API alongside LastBuildTime; drives the adaptive idle window — a project that
                  builds often earns a longer effective idle before scale-to-zero.
                items:
                  format: date-time
                  type: string
                type: array
              replicas:
                description: Replicas is the current desired/observed replica count
                  (0 or 1).
                format: int32
                type: integer
            required:
            - inflightBuilds
            - replicas
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
