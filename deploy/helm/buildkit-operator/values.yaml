# Default values for the buildkit-operator chart.
# This installs the CLUSTER-WIDE control plane only. The per-project buildkitd
# StatefulSets, their Services and cache PVCs are reconciled by the buildd
# controller at runtime from BuildProject custom resources — they are never
# templated here.

# Three-namespace topology, split by trust/role so each namespace carries ONLY the Kyverno exemption
# its workloads need (least privilege):
#   - operator: the control plane (buildd + gateway). Hardened (nonroot, readOnlyRootFS, caps drop ALL)
#               — needs NO privileged/securityContext exemption.
#   - builds:   the per-project build daemons (+ untrusted forks) and their certs/config/mirror. This is
#               where untrusted build code runs; it needs the securityContext exemption (rootless
#               buildkit relaxes allowPrivilegeEscalation + seccomp/apparmor).
# The Kata node plumbing lives in a THIRD namespace (buildkit-system), installed out-of-band — see
# deploy/kata/, it is not part of this chart.
namespaces:
  operator: buildkit-operator
  builds: buildkit-builds
# Render the two Namespace objects (labelled) as part of the chart. Set false if they are created
# out-of-band (e.g. by GitOps / the platform). `helm install --namespace <operator>` only creates the
# release namespace; the builds namespace must exist, so keep this on unless you pre-create it.
createNamespaces: true

# buildd runs HA: >1 replica with leader election (only the leader reconciles; the /route API
# is served by every replica behind the Service).
replicaCount: 2
leaderElection: true

# --- buildd: the controller-runtime manager + HTTP /route API on :8080 -------
image:
  repository: ghcr.io/socialgouv/buildkit-operator-buildd
  # Empty = pin to the chart appVersion (an immutable release tag) for reproducible deploys.
  # Override only for local/dev images (e.g. tag: dev). Never ship a floating tag to prod.
  tag: ""
  pullPolicy: IfNotPresent

# --- companion: the inode-GC backstop sidecar -------------------------------
# buildd injects this image as a sidecar into every per-project buildkitd pod it
# creates. It is surfaced here so the controller can read it from its env and so
# the whole fleet is pinned to one digest/tag.
companion:
  # Inject the companion sidecar into per-project daemons. Requires the companion image to
  # be built+pushed (it bundles buildctl). Set false to run daemon-only (no inode backstop).
  enabled: true
  image:
    repository: ghcr.io/socialgouv/buildkit-operator-companion
    # Empty = pin to the chart appVersion. The companion bundles buildctl and must stay in lockstep
    # with the buildd release (its buildctl talks to the daemon); keep it on the same version.
    tag: ""
    pullPolicy: IfNotPresent

# --- buildkitd: the per-project daemon image --------------------------------
# Pinned to a release (NOT master) for reproducible builds across the fleet.
# Rootless variant by default to minimise breakout surface.
buildkit:
  # renovate: datasource=docker depName=moby/buildkit versioning=docker
  image: moby/buildkit:v0.31.1-rootless
  # gRPC port each per-project Service exposes (TCP + mTLS).
  port: 1234

# --- Per-project daemon defaults --------------------------------------------
# Default StorageClass for the per-project cache PVCs when a BuildProject sets none. Empty = the cluster's
# DEFAULT StorageClass (cloud-portable). OVH MKS: csi-cinder-high-speed-gen2; EKS: e.g. ebs-gp3 (or leave
# empty for the cluster default).
defaultStorageClass: ""

# The other baseline defaults (cacheVolumeGi, tier, idleTimeoutSec, securityProfile) come from the
# CRD's +kubebuilder:default markers. Two chart-level surfaces refine them:
#
# adaptiveIdle: a warm project's EFFECTIVE idle window scales with its observed build cadence
# (spec idleTimeoutSec × builds in the trailing 24h), capped at maxSeconds — frequent builders stay
# warm between builds without pinning tier=hot, quiet projects still scale to zero, and the fleet
# cost stays proportional to observed usage. 0 disables adaptivity (spec idle applies verbatim).
adaptiveIdle:
  maxSeconds: 21600

# autoGrow: bounded cache-volume auto-grow. buildkitd GC reclaims layers past ~85% of the volume, so
# a project whose working set outgrows its PVC silently thrashes its cache. Past thresholdPct usage
# (measured by the companion's statfs, polled by the reconciler on warm daemons) the PVC grows by
# factor — never beyond maxGi, the per-project cost quota. Growth is one-way (Cinder can't shrink);
# the filesystem resize lands via an idle-time pod bounce. thresholdPct: 0 disables.
# Requires the storage class to allow volume expansion (csi-cinder gen2 does).
autoGrow:
  thresholdPct: 80
  factor: 1.5
  maxGi: 240

# projectDefaults: admin-declared rules seeded into the BuildProject buildd auto-creates at first
# /route (create-only — existing CRs keep their spec; delete a CR to re-seed it). First matching
# rule wins. `repo` uses the SAME semantics as oidc.repoAllowlist ("*" = any, "pfx/*" = prefix that
# crosses "/" — covers GitLab nested subgroups, patterns copy verbatim between the two lists), over
# the NORMALIZED repo. `name` is a shell-style glob (path.Match); arch is exact; empty = any.
# Seedable fields: tier / idleTimeoutSec / cacheVolumeGi / s3Cache (cadence|always|never).
# FIRST MATCH WINS — put specific rules before glob rules, or a broad glob silently
# shadows the narrow rule below it. Example:
#   projectDefaults:
#     - repo: github.com/socialgouv/iterion
#       name: iterion-sandbox-finalize
#       s3Cache: never   # COPY-only builds whose inputs live in the registry — S3 rehydrates nothing
#     - repo: github.com/socialgouv/iterion
#       name: "iterion-sandbox-*"
#       cacheVolumeGi: 120
#     - repo: "github.com/socialgouv/*"
#       tier: hot
projectDefaults: []

# VolumeSnapshotClass for cache durability snapshots (M3). Empty = snapshots DISABLED (cloud-portable
# default). OVH: csi-cinder-snapclass-in-use-v1 (in-use snapshots — no scale-to-zero needed). EKS: an
# EBS-CSI VolumeSnapshotClass (EBS snapshots aren't "in-use", so the controller scales to zero first).
snapshotClassName: ""

# Durability snapshots retained per project (M3, oldest pruned).
snapshots:
  keep: 3

# S3 cold cache as a PROJECT policy. When `bucket` is set, buildd returns the per-project cache
# reference on /route and clients apply it automatically — no S3 config or credentials on the CI
# side. The daemons read the AWS creds from `credsSecret` (env AWS_ACCESS_KEY_ID/SECRET). Point this
# at OVH Object Storage in production; an empty bucket disables the cold cache.
s3:
  bucket: ""
  region: us-east-1
  endpoint: "" # e.g. https://s3.gra.io.cloud.ovh.net (empty = AWS default)
  credsSecret: "" # k8s Secret with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
  # Export throttle for the default s3CachePolicy=cadence: the retained PVC already covers warm
  # restarts, so the cold cache only pays on rare events (inode prune, lost volume, cluster
  # rebuild) — imports stay on every build (cheap), exports run at most once per interval per
  # project (a ≤6h-old cache rehydrates just as well). "0" restores export-on-every-build.
  # Per-project override: spec.s3CachePolicy (always|never|cadence), seeded via projectDefaults.
  cacheExportInterval: 6h
  # Bucket GC. buildkit's s3 cache exporter only ever WRITES (blobs + manifests, mode=max) — it never
  # deletes, so without a lifecycle policy the bucket grows forever. When enabled (and bucket is set),
  # a post-install/post-upgrade hook Job applies the bucket lifecycle configuration using the daemons'
  # creds: objects expire after expireDays (a cold-cache miss is a rebuild, never an error, so expiry
  # is safe), and incomplete multipart uploads are aborted after abortMultipartDays (reclaims parts
  # left behind by interrupted or racing cache exports — those are invisible to object listings but
  # still billed). Set enabled: false to manage the bucket lifecycle out-of-band.
  lifecycle:
    enabled: true
    expireDays: 60
    abortMultipartDays: 7
    # renovate: datasource=docker depName=amazon/aws-cli versioning=docker
    image: amazon/aws-cli:2.30.3

# Network egress lockdown for the build daemons: they keep DNS + registry/package internet + external
# S3, but cannot reach other in-cluster pods (lateral-movement + inter-daemon isolation). For an
# IN-CLUSTER S3/MinIO or a pull-through cache mirror, allowlist it under extraEgress, e.g.:
#   extraEgress:
#     - to: [{ podSelector: { matchLabels: { app: minio } } }]
#       ports: [{ protocol: TCP, port: 9000 }]
networkPolicy:
  enabled: true
  extraEgress: []
  # Secure default: UNTRUSTED fork daemons get a stricter, internet-less egress (DNS + extraEgress only),
  # so base images come ONLY through the in-cluster pull-through mirror and untrusted builds cannot
  # exfiltrate to arbitrary hosts. Trusted (canonical) daemons keep full internet. This means a fork can
  # only pull what you allowlist under extraEgress (the mirror, and S3 if used) — without a mirror, forks
  # are DNS-only BY DESIGN. Set false to let untrusted forks reach the open internet (NOT recommended).
  forkEgressStrict: true

# Pull-through cache for base-image (FROM) pulls: LAN-speed, immune to Docker Hub rate limits,
# resilient to upstream outages. `enabled` bundles a registry:2 proxy; `host` is the mirror the
# daemons use in buildkitd.toml (point it at the bundled Service, or an external mirror). One upstream
# per registry. NB: with networkPolicy on, allowlist `host` under networkPolicy.extraEgress.
mirror:
  enabled: false
  host: "" # e.g. buildkit-operator-mirror:5000
  upstream: https://registry-1.docker.io
  image: registry:2
  storage: 20Gi
  storageClass: "" # empty = the cluster's default StorageClass
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

# Sandboxed runtime for UNTRUSTED fork daemons only (trusted daemons keep the default runtime for
# speed). The build runs attacker-controlled code, so isolate forks harder than runc. Point at an
# installed RuntimeClass: `sysbox-runc` keeps no_new_privs ON (lets you drop the Kyverno exemption);
# `gvisor`/`kata` are alternatives. Requires the runtime installed on the nodes + the RuntimeClass.
sandbox:
  # RuntimeClass for UNTRUSTED fork daemons (the VM/sandbox is the security boundary). On Kata, use
  # `kata-clh` (cloud-hypervisor — boots fast enough to survive nested virt; `kata-qemu` times out).
  # NOTE on NESTED virt (e.g. OVH MKS): bump the kata guest to >=4 vCPUs (configuration-clh.toml
  # `default_vcpus = 4`) or the agent is too slow to answer the CRI status query and the VM gets killed.
  # When set, fork daemons run the NON-rootless buildkit image PRIVILEGED (rootless can't run in the
  # guest); the VM isolates them. Trusted (canonical) daemons keep rootless + the default runtime.
  runtimeClass: ""
  # Non-rootless buildkit image for sandboxed forks. Empty = derived from buildkit.image (strip -rootless).
  buildkitImage: ""

# Scheduling for the per-project daemon pods (NOT the buildd control plane — that uses nodeSelector/
# tolerations/affinity below). The recommended PRODUCTION topology pins daemons to a DEDICATED build
# nodepool so build spikes and untrusted RUN code stay off the app / control-plane nodes (and you can
# install a sandboxed runtime there). Taint the pool (e.g. workload=buildkit:NoSchedule), then set a
# matching toleration + a nodeSelector here. All empty = daemons schedule anywhere (dev / shared).
#   daemonScheduling:
#     nodeSelector: { nodepool: buildkit }
#     tolerations:
#       - { key: workload, operator: Equal, value: buildkit, effect: NoSchedule }
daemonScheduling:
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # pinArch (opt-in, default false): add a kubernetes.io/arch nodeSelector matching each build's arch, so
  # amd64 daemons land on amd64 nodes and arm64 on arm64/Graviton — native multi-arch, no QEMU. Off, an
  # arm64 build may still fall back to QEMU on a binfmt-enabled node. Set true once per-arch nodepools
  # are available. The build's own arch WINS over a kubernetes.io/arch entry in nodeSelector above
  # (a global pin must not silently schedule a daemon on the wrong architecture).
  pinArch: false

# Max concurrent cold-start attaches buildd allows (M4 backpressure; seed from bench C so a
# CI burst does not serialize Cinder attaches into minutes).
maxColdStarts: 8

# Safety net for a build whose /complete never arrives (a cancelled CI job kills the runner before its
# cleanup): an inflight entry older than this stops pinning its daemon warm and is swept from the
# project status. Entries expire INDIVIDUALLY, so this is the longest a single leaked build can hold a
# daemon — set it above the longest build you expect, not below.
maxBuildSeconds: 7200

# Prometheus metrics endpoint (M4). Scrape buildkit_operator_* + controller-runtime metrics here.
metrics:
  port: 8081

serviceAccount:
  # Name of the ServiceAccount buildd runs as. If empty, the chart fullname is
  # used. Namespaced RoleBindings bind the buildd Roles to this SA.
  name: buildkit-operator-buildd

# Resources for the buildd controller pod (NOT the per-project daemons — those
# are sized per BuildProject.spec.resources).
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Shared SNI gateway for off-cluster CI. When `host` is set, daemons stay ClusterIP and ONE
# LoadBalancer (the gateway) fronts all of them: buildd returns tcp://<daemon>.<host>:1234 and the
# gateway routes by SNI to the daemon's ClusterIP — mTLS stays end-to-end. Point a wildcard DNS
# *.<host> at the gateway LB; the daemon cert SAN must cover *.<host>. Empty host = in-cluster only.
gateway:
  host: "" # e.g. builds.buildkit-operator.example.com
  # Additional gateway domains the SAME gateway also accepts (SNI <daemon>.<domain>). Lets one gateway
  # front several client populations — e.g. a public domain AND a CI-platform domain reached via a
  # proxy. The daemon cert SAN must cover *.<each> (create-certs.sh GATEWAY_HOST accepts a comma list;
  # cert-manager adds them). Clients pick which domain by overriding it their side (BUILDKIT_OPERATOR_GATEWAY_HOST).
  extraDomains: [] # e.g. [bko.fabrique.example.com]
  # External port off-cluster clients dial (the SNI endpoint /route returns). Empty = the daemon port
  # (buildkit.port, 1234). Set to 443 to front the gateway on 443 — e.g. so runners behind an
  # egress proxy can CONNECT-tunnel to it. The gateway still dials the daemons on buildkit.port internally.
  externalPort: ""
  # On a rollout the gateway stops accepting and keeps proxying the builds already streaming through
  # it, for at most this long — every open connection IS a build, so cutting one loses the build. The
  # pod's terminationGracePeriodSeconds is set 60s above this. Lower it only if you would rather end a
  # gateway rollout quickly than let long builds finish.
  drainSeconds: 3600
  image:
    repository: ghcr.io/socialgouv/buildkit-operator-gateway
    # Empty = pin to the chart appVersion (immutable). The gateway is the public-facing LB front; never
    # ship it on a floating tag.
    tag: ""
  # Cap concurrent connections the public-facing gateway accepts (per replica), BEFORE mTLS auth — so an
  # unauthenticated TCP flood can't exhaust gateway resources. Each build holds one long-lived
  # connection, so size this above the expected concurrent-build peak (with 2 replicas the cluster cap is
  # 2×). 0 = unlimited (NOT recommended on a public LB).
  maxConns: 1024
  service:
    type: LoadBalancer
    # LB annotations are CLOUD-SPECIFIC — set the ones your cloud's controller honors. A build holds ONE
    # long-lived mTLS stream, so RAISE the LB idle timeout well past the longest build. Examples:
    #   OVH/OpenStack CCM:  loadbalancer.openstack.org/timeout-member-data: "600000"
    #                       loadbalancer.openstack.org/timeout-client-data: "600000"
    #   AWS LB Controller:  service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # (in-cluster runners need no gateway at all — leave gateway.host empty.)
    annotations: {}
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 128Mi }

# buildd Service (exposes the /route API and /healthz on :8080). Set type: LoadBalancer to reach
# the /route API from off-cluster runners.
service:
  port: 8080
  type: ClusterIP
  # SAFETY: this L4 LoadBalancer serves /route over PLAIN HTTP (no TLS). The chart REFUSES to render a
  # LoadBalancer buildd Service unless you set BOTH auth.tokenSecret AND restrict the source IPs here
  # (a cleartext bearer token open to the internet is not enough). For PUBLIC off-cluster access prefer
  # the TLS Ingress (ingress.enabled). Leave empty for in-cluster (ClusterIP) use.
  loadBalancerSourceRanges: []
  # Cloud-specific LB annotations (only when type: LoadBalancer). /route blocks up to --route-wait (180s)
  # for a cold daemon, so RAISE the LB idle timeout past it. Example (OVH/OpenStack CCM):
  #   loadbalancer.openstack.org/timeout-member-data: "200000"
  #   loadbalancer.openstack.org/timeout-client-data: "200000"
  annotations: {}

# Optional Ingress for the buildd /route API — terminates TLS on 443 under a public hostname, so
# off-cluster runners that can only egress via an HTTPS proxy (e.g. a CI platform behind a CONNECT
# proxy) can reach /route. buildd speaks plain HTTP; the Ingress does the TLS. Pair it with auth
# (auth.tokenSecret) — /route provisions daemons. Leave disabled for the LoadBalancer/in-cluster paths.
ingress:
  enabled: false
  className: "" # e.g. nginx / traefik (empty = cluster default)
  host: "" # e.g. buildd.bko.fabrique.example.com
  # e.g. cert-manager.io/cluster-issuer: letsencrypt
  # /route blocks until the daemon is Ready, so the FIRST build of a project cold-starts (PVC provision
  # + image pull, ~1-2 min) — raise the proxy read timeout above the default 60s or that request 504s at
  # the proxy: nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
  annotations: {}
  # Only set true if TLS is terminated by an upstream load balancer/proxy before this Ingress.
  allowInsecure: false
  tls:
    enabled: true
    secretName: "" # TLS secret holding the host cert (cert-manager fills it from the annotation, or pre-create it)

# Names of the mTLS Secrets minted by deploy/cert/create-certs.sh. The daemon Secret is mounted by
# per-project daemons (the controller wires its NAME into each StatefulSet). buildd itself does NOT
# dial daemons (it only reads StatefulSet status via the API), so it mounts no client cert; the client
# Secret is distributed to CI runners (the `build` CLI / Action), not to buildd.
certs:
  daemonSecretName: buildkit-daemon-certs
  clientSecretName: buildkit-client-certs

# Optional: let cert-manager issue the mTLS material instead of deploy/cert/create-certs.sh (mkcert).
# When enabled, the chart renders Certificate resources for the daemon + client Secrets above and buildd
# remaps the daemon Secret's tls.crt/tls.key/ca.crt onto the cert.pem/key.pem/ca.pem the daemon reads
# (--cert-manager-certs). Needs cert-manager in the cluster and a CA issuer — `ca.create` bootstraps a
# self-signed one in this namespace if you have no PKI (the platform's only issuer is public Let's
# Encrypt, which cannot sign a private mTLS chain).
certManager:
  enabled: false
  # The issuer that signs the daemon + client certs. Empty + ca.create=true uses the bootstrapped CA.
  issuerRef:
    name: "" # e.g. buildkit-operator-ca (the bootstrapped Issuer) or your own CA (Cluster)Issuer
    kind: Issuer # Issuer | ClusterIssuer
    group: cert-manager.io
  duration: 8760h # 1y leaf certs
  renewBefore: 720h # 30d
  # Bootstrap a self-signed CA (namespaced Issuer) in this namespace; mTLS then trusts that CA.
  ca:
    create: false
    duration: 87600h # 10y CA root

# Optional bearer-token auth for the buildd /route API. REQUIRED if you expose the buildd Service
# off-cluster (service.type: LoadBalancer) — otherwise anyone reaching /route can spin up daemons.
# Create a Secret with key `token`, set its name here; buildd reads it as $BUILDKIT_OPERATOR_AUTH_TOKEN
# and CI passes the same value (build --token / BUILDKIT_OPERATOR_TOKEN). Empty = no auth (in-cluster only).
auth:
  # LEGACY shared bearer for /route. It authenticates the CALLER but not the project: on this path the
  # client declares its own repo, so any holder can build as — and poison the cache of — any project.
  # oidc.providers is the replacement (the repo comes from a forge-signed claim). Keep this set only
  # while migrating callers, then clear it: it is a bypass of every repo-scoped check while present.
  tokenSecret: "" # k8s Secret name holding key `token`

# OIDC identity verification for the /route API — the strong way to expose buildd off-cluster. When
# `providers` is non-empty, buildd REQUIRES a forge-signed OIDC token on /route|/prewarm and binds the
# verified repo claim: the client can no longer self-declare its repo (kills cross-repo cache poisoning)
# and `untrusted` is derived server-side. Config is mounted as a ConfigMap (--oidc-config); it is the
# RECOMMENDED posture for any LoadBalancer/Ingress exposure. Empty providers = OIDC off (in-cluster
# bearer/admin only). Both GitHub Actions and GitLab CI mint these tokens natively (no extra egress).
oidc:
  providers: []
    # - type: github   # built-in mapping: repository claim, github.com host, PR ref => untrusted
    #   issuer: https://token.actions.githubusercontent.com
    #   audience: buildkit-operator
    # - type: gitlab   # built-in mapping: project_path claim, issuer host; same-project refs trusted
    #   issuer: https://gitlab.example.com
    #   audience: buildkit-operator
    #   # strictUnprotectedRefs: true  # opt-in: unprotected refs => untrusted fork daemon (for projects
    #   #                              # where anyone can push; default false — a fork's MR pipeline
    #   #                              # already runs under the FORK's own project_path + allowlist)
    # - type: forgejo  # built-in mapping (also "gitea"): repository claim, issuer host, PR ref => untrusted
    #   issuer: https://forge.example.com/api/actions   # the Forgejo ACTIONS OIDC issuer (subpath), not the root
    #   audience: buildkit-operator
  # Optional HARD org/repo gate applied AFTER signature verification (globs; trailing /* = prefix).
  # Empty = allow every verified repo (OIDC alone is the gate). A verified-but-unlisted repo gets 403.
  repoAllowlist: []
    # - github.com/socialgouv/*
    # - gitlab.example.com/studio-tech/architecture/*
  # Break-glass admin credential: a Secret (key `token`) carried in the X-Buildkit-Operator-Admin-Token
  # header. It bypasses OIDC and trusts the request's repo/untrusted — for the manual `build` CLI and
  # in-cluster ops. Held only by operators who already control this Deployment. Empty = no admin token.
  adminTokenSecret: ""
  # Cluster-admin escape hatch to force verification OFF even with providers configured. Leave false; set
  # true only as a deliberate, audited break-glass (it reopens the self-declared-repo trust).
  disable: false

# Routing-API rate limit (token bucket shared across /route, /prewarm, /complete) — caps how fast a
# single caller / compromised token can churn BuildProjects + Cinder attaches. Both keys are passed
# through only when set; omit them to keep buildd's built-in defaults (50 req/s, burst 100). Set
# rateLimit to 0 to disable (NOT recommended once /route is on a public LoadBalancer).
api:
  rateLimit: 50
  rateBurst: 100
  # Require /complete to carry the buildId that /route minted. That id is the only thing tying a
  # release to the build that started it: without it a release names a project by key alone, which any
  # authenticated caller can do for ANY project — draining its in-flight set and letting its daemon
  # scale down under a running build. Clients have sent the id since v0.17.0; turn this on once every
  # consumer is past it (older clients then get a 400 on release and leak an entry until it expires).
  requireBuildId: false

# Optional node scheduling controls for the buildd pod.
nodeSelector: {}
tolerations: []
affinity: {}
