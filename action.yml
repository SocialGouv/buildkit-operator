name: "buildkit-operator build"
description: "Build a container image via buildkit-operator: route to the project's hot buildkitd and build with buildx remote over mTLS (warm cache, optional S3 cold cache, monorepo-aware)."
author: "SocialGouv"
branding:
  icon: package
  color: blue

inputs:
  buildd-url:
    description: "buildd /route API URL (LoadBalancer/Ingress)."
    required: true
  ca:
    description: "Client mTLS CA (PEM)."
    required: true
  cert:
    description: "Client mTLS certificate (PEM)."
    required: true
  key:
    description: "Client mTLS private key (PEM)."
    required: true
  token:
    description: >-
      Fallback credential for the /route API when OIDC isn't used: a legacy bearer token, OR a break-glass
      admin token (see admin-token). Leave empty when buildd enforces OIDC (the recommended setup) — the
      action mints a GitHub OIDC token automatically. Requires the caller job to set permissions.id-token: write.
    default: ""
  admin-token:
    description: "Break-glass admin token (sent in the X-Buildkit-Operator-Admin-Token header) — bypasses OIDC. For ops only."
    default: ""
  oidc-audience:
    description: "Audience for the GitHub OIDC token minted for buildd /route auth. Must match buildd's provider audience. Empty = don't mint (use token/admin-token)."
    default: "buildkit-operator"
  tags:
    description: "Image tag(s), whitespace-separated (e.g. ghcr.io/org/app:sha)."
    required: true
  repo:
    description: "Project identity = the cache key. Defaults to the GitHub repository. IGNORED when buildd enforces OIDC (the verified repo claim is authoritative); used only on the legacy/admin path."
    default: ${{ github.repository }}
  name:
    description: "Optional monorepo component — gives each image its own daemon + cache."
    default: ""
  arch:
    description: "Build architecture: amd64 | arm64."
    default: amd64
  context:
    description: "Build context path."
    default: "."
  file:
    description: "Dockerfile path (default: Dockerfile in the context)."
    default: ""
  target:
    description: "Dockerfile target stage."
    default: ""
  build-args:
    description: "Build args, one KEY=VALUE per line (forwarded to buildx as --build-arg)."
    default: ""
  labels:
    description: "OCI image labels, one key=value per line (forwarded to buildx as --label)."
    default: ""
  secrets:
    description: "Build secrets, one id=value per line (forwarded to buildx as --secret id=…,env=…). Sent over the build session only — hashed into the cache key, never stored in a layer, the cache, or the image config."
    default: ""
  untrusted:
    description: "Untrusted (fork-PR) build: route to an ephemeral daemon, no write-back to the shared cache (anti cache-poisoning)."
    default: "false"
  push:
    description: "Push the result to the registry."
    default: "false"
  gateway-host:
    description: "Optional: the gateway's public domain (e.g. bkod.example.com). When set, the daemon endpoint is reached at buildkitd-<key>.<gateway-host> over real wildcard DNS — preferred over gateway-ip (IP-independent, survives a gateway LB IP change)."
    default: ""
  gateway-ip:
    description: "Optional: gateway LoadBalancer IP, to map the gateway hostname for this run when there is no wildcard DNS yet (testing/bootstrap). Prefer gateway-host when wildcard DNS exists."
    default: ""
  provenance:
    description: "SLSA provenance attestation, e.g. 'mode=max' (needs push: true). Empty = off."
    default: ""
  sbom:
    description: "Generate an SBOM attestation (needs push: true)."
    default: "false"
  sign:
    description: "cosign keyless-sign the pushed image. Requires push: true and the caller job to set permissions.id-token: write."
    default: "false"

outputs:
  digest:
    description: "Image digest (sha256:...) of the build result. Populated when push: true."
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
    # Mint a GitHub OIDC identity token for buildd /route auth — buildd verifies its signature and binds
    # the build to ${{ github.repository }} server-side, so a leaked token can't impersonate another repo.
    # Needs the caller job's permissions.id-token: write; degrades to the `token` input when absent.
    # The minting itself lives in scripts/build.sh (see BKO_OIDC_AUDIENCE on the build step).
    - id: auth
      shell: bash
      env:
        BKO_OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
        BKO_TOKEN_INPUT: ${{ inputs.token }}
      run: |
        # Only the explicit fallback is resolved here. The OIDC token is minted by scripts/build.sh,
        # which needs to mint again at release time anyway (a build outlives the token minted at job
        # start) — one implementation, one behaviour.
        token="${BKO_TOKEN_INPUT}"
        if [ -n "$token" ]; then
          echo "::add-mask::$token"
          echo "BUILDKIT_OPERATOR_TOKEN=$token" >> "$GITHUB_ENV"
        fi
    - id: build
      shell: bash
      env:
        BUILDKIT_OPERATOR_BUILDD_URL: ${{ inputs.buildd-url }}
        BUILDKIT_OPERATOR_CA: ${{ inputs.ca }}
        BUILDKIT_OPERATOR_CERT: ${{ inputs.cert }}
        BUILDKIT_OPERATOR_KEY: ${{ inputs.key }}
        # BUILDKIT_OPERATOR_TOKEN is set by the auth step above when a `token` input was given;
        # otherwise scripts/build.sh mints an OIDC one from BKO_OIDC_AUDIENCE below.
        BUILDKIT_OPERATOR_ADMIN_TOKEN: ${{ inputs.admin-token }}
        # The OIDC token minted above expires in about two minutes, so the release at the end of a real
        # build would go out with a dead one. The script re-mints from this audience just before it.
        BKO_OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
        REPO: ${{ inputs.repo }}
        NAME: ${{ inputs.name }}
        ARCH: ${{ inputs.arch }}
        BUILD_CONTEXT: ${{ inputs.context }}
        DOCKERFILE: ${{ inputs.file }}
        TARGET: ${{ inputs.target }}
        BUILD_ARGS: ${{ inputs.build-args }}
        LABELS: ${{ inputs.labels }}
        SECRETS: ${{ inputs.secrets }}
        UNTRUSTED: ${{ inputs.untrusted }}
        TAGS: ${{ inputs.tags }}
        PUSH: ${{ inputs.push }}
        BUILDKIT_OPERATOR_GATEWAY_HOST: ${{ inputs.gateway-host }}
        GATEWAY_IP: ${{ inputs.gateway-ip }}
        PROVENANCE: ${{ inputs.provenance }}
        SBOM: ${{ inputs.sbom }}
      run: ${{ github.action_path }}/scripts/build.sh
    - if: ${{ inputs.sign == 'true' }}
      uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
    - if: ${{ inputs.sign == 'true' }}
      shell: bash
      env:
        TAGS: ${{ inputs.tags }}
      run: |
        for t in $TAGS; do echo "cosign sign $t"; cosign sign --yes "$t"; done
